<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;background:#f5f7fb;font-family:"Microsoft YaHei","Noto Sans SC","SimHei",Arial,sans-serif;color:#333}.app{width:100%;max-width:430px;margin:0 auto;min-height:100vh;background:#fff;position:relative;overflow-x:hidden}.page{display:none;min-height:100vh;background:#fff}.page.active{display:block}.topbar{height:55px;background:#fff;border-bottom:1px solid #e9e9e9;display:flex;align-items:center;justify-content:center;position:relative;z-index:30}.topbar .title{font-size:21px;font-weight:700;letter-spacing:.5px}.back{position:absolute;left:17px;top:15px;width:24px;height:24px;border-left:3px solid #5b5b5b;border-bottom:3px solid #5b5b5b;transform:rotate(45deg);cursor:pointer}.home{background:#eef4ff;min-height:100vh;position:relative}.home:before{content:"";position:absolute;inset:360px 0 0 0;background:radial-gradient(ellipse at 18% 52%,rgba(189,220,255,.18) 0,rgba(189,220,255,.08) 23%,transparent 24%),linear-gradient(110deg,transparent 60%,rgba(207,229,255,.38) 60%,rgba(231,243,255,.15) 75%,transparent 76%);opacity:.75}.banner{width:100%;height:227px;background:url('assets/banner.jpg') center/cover no-repeat}.home-card-wrap{position:relative;padding:0 18px}.menu-card{height:91px;background:#fff;border-radius:0 0 18px 18px;margin:0 0 12px 0;display:flex;align-items:center;padding:0 31px;position:relative;cursor:pointer}.menu-card.second{height:106px;border-radius:13px;margin-top:12px}.menu-icon{width:48px;height:48px;border-radius:18px;margin-right:18px;display:grid;place-items:center;box-shadow:0 0 9px rgba(80,143,255,.13)}.menu-icon.green{background:#dffcf2}.menu-icon.blue{background:#e4eeff}.menu-icon svg{width:31px;height:31px}.menu-text .main{font-size:21px;color:#222;line-height:1.3}.menu-text .sub{font-size:14px;color:#999;margin-top:8px}.arr{position:absolute;right:28px;top:50%;width:19px;height:19px;border-top:2px solid #333;border-right:2px solid #333;transform:translateY(-50%) rotate(45deg)}.home-foot-space{height:520px}
.reserve-page{background:#f4f4f4;padding-bottom:14px}.section{background:#fff;border-radius:0 0 7px 7px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden}.section-title{height:53px;display:flex;align-items:center;padding:0 17px;font-size:18px;color:#fff;background:linear-gradient(90deg,#72c1ff 0%,#eef8ff 100%)}.form-body{padding:13px 16px 8px}.field{border-bottom:1px solid #eee;padding:0 0 12px;margin-bottom:19px;position:relative}.label{font-size:17px;color:#666;line-height:25px;margin-bottom:15px}.req{color:red;margin-right:5px}.placeholder,.value{height:24px;line-height:24px;font-size:16px;color:#c9cbd0}.value{color:#333}.calendar{position:absolute;right:0;bottom:16px;color:#999;font-size:16px}.checks{display:flex;gap:26px;align-items:center;padding:2px 0 11px}.box{display:inline-flex;align-items:center;font-size:18px;color:#222;margin-right:4px}.sq,.radio{width:21px;height:21px;border:1.5px solid #cfcfcf;background:#f8f8f8;margin-right:9px;display:inline-block}.radio{border-radius:50%}.radio.on,.sq.on{background:#4098ff;border-color:#4098ff;position:relative}.radio.on:after{content:"";position:absolute;width:7px;height:12px;border-right:2px solid #fff;border-bottom:2px solid #fff;left:6px;top:2px;transform:rotate(45deg)}.sq.on:after{content:"✓";color:#fff;position:absolute;left:3px;top:-2px;font-size:17px}.add-row{height:36px;margin:22px 16px 10px;border:1px dashed #d7d7d7;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#555;cursor:pointer}.add-row.blue{border-color:#39a7ff;color:#27a0ff;margin-top:16px}.plus{font-size:24px;margin-right:12px;font-weight:300}.submit{margin:16px 17px 9px;height:49px;border-radius:4px;background:#1895f9;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.16);cursor:pointer}.saveico{font-size:20px;margin-right:10px}.visitor-card{margin:17px 11px 0;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.10);padding:17px 13px 6px}.visitor-head{display:flex;justify-content:space-between;font-size:16px;margin-bottom:19px}.delete{color:#f5222d}.err{color:#ff1f2d;font-size:16px;margin-top:10px;margin-bottom:17px}.select-arrow{position:absolute;right:0;bottom:18px;width:13px;height:13px;border-top:2px solid #aaa;border-right:2px solid #aaa;transform:rotate(45deg)}.data-error{color:#ff1f2d;font-size:16px;margin:8px 14px 0}.hidden{display:none!important}
.record-page{background:#fff}.record-sticky{position:sticky;top:0;background:#fff;z-index:50;box-shadow:0 1px 0 #eee}.notice{height:45px;background:#fff6ce;color:#ff5b00;font-size:17px;display:flex;align-items:center;padding:0 18px;border-top:1px solid #f0e9b8}.notice svg{width:22px;height:22px;margin-right:12px;flex:0 0 auto}.search-form{padding:47px 12px 18px;background:#fff}.search-form.filled{padding-top:33px}.search-line{height:43px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.search-line input{border:0;outline:0;font-size:17px;color:#222;width:72%;font-family:inherit;background:transparent}.search-line input::placeholder{color:#c5c7cc}.must{font-size:16px;color:red}.search-btn{height:51px;background:#1e96f4;color:#fff;border-radius:4px;margin:13px 0 0;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 2px 5px rgba(0,0,0,.08);cursor:pointer}.search-btn svg{width:23px;height:23px;margin-right:14px}.filter{text-align:right;color:#5f6063;font-size:18px;margin:55px 18px 0}.filter svg{width:18px;height:18px;vertical-align:-2px;margin-left:6px}.empty{text-align:center;color:#d4d4d4;margin-top:118px}.empty svg{width:88px;height:70px;display:block;margin:0 auto 12px}.empty div{font-size:18px}.list-wrap{padding:18px 17px 30px;background:#fff}.record-card{position:relative;background:#fff;border:1px solid #dedede;border-radius:10px;margin:0 0 18px;box-shadow:0 8px 18px rgba(0,0,0,.18);overflow:hidden}.tag{display:inline-block;border:1px solid #d1d1d1;border-radius:5px;color:#555;background:#fafafa;font-weight:700;font-size:17px;padding:2px 8px;margin:20px 0 17px 27px}.status{position:absolute;right:0;top:0;padding:4px 10px;font-size:15px;border-radius:0 9px 0 9px}.status.pending{border:1px solid #cfcfcf;background:#fff;color:#222}.status.pass{background:#52c41a;color:#fff}.record-info{border-top:1px solid #eee;padding:18px 17px 18px}.record-name{font-size:20px;font-weight:700;margin-bottom:13px}.info-row{font-size:17px;line-height:26px;white-space:nowrap}.info-row .k{color:#333;margin-right:10px}.info-row .v{color:#999}.actions{height:45px;border-top:1px solid #e5e5e5;display:flex}.act{flex:1;display:flex;align-items:center;justify-content:center;font-size:17px;color:#168dff;border-right:1px solid #e5e5e5;cursor:pointer}.act:last-child{border-right:0}.act.del{color:#ff4d2e}.detail-page{background:#f4f4f4;padding:10px 10px 28px}.detail-section{border-radius:8px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);overflow:hidden;margin:0 0 10px}.detail-title{height:52px;background:linear-gradient(90deg,#80c5ff,#ecf8ff);color:#fff;font-size:15px;display:flex;align-items:center;padding:0 19px}.detail-body{padding:12px 18px 13px}.detail-item{border-bottom:1px solid #eee;padding:0 0 12px;margin-bottom:13px}.detail-label{font-size:14px;color:#777;margin-bottom:13px}.detail-value{font-size:14px;color:#333;line-height:20px}.inner-card{background:#fff;margin:16px 10px 13px;padding:16px 17px 12px;box-shadow:0 0 13px rgba(0,0,0,.12)}.inner-card .field{margin-bottom:15px;padding-bottom:11px}.inner-card .label{font-size:14px;margin-bottom:11px}.inner-card .value,.inner-card .placeholder{font-size:14px}.radio-line{display:flex;align-items:center;gap:14px;color:#aaa;font-size:14px}.radio.sm{width:20px;height:20px;margin-right:5px}.radio.sm.on:after{left:6px;top:2px}.fee{padding:11px 19px;border-top:1px solid #eee}.fee .label{font-size:14px;margin-bottom:11px}.table{margin:19px 29px 5px;border-collapse:collapse;width:calc(100% - 58px);font-size:14px}.table th,.table td{border-bottom:1px solid #eee;padding:9px 4px;text-align:left}.table th{font-weight:700;color:#111}.table td{color:#444}.spacer20{height:20px}@media(min-width:700px){body{background:#e9edf5}.app{box-shadow:0 0 0 1px #ddd}}
